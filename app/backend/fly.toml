# fly.toml — Talk Box backend
# Deploy from the app root so the Docker build can include database/sacramento.db:
#   cd app && fly deploy -c backend/fly.toml
#
# First-time setup:
#   1. fly postgres create --name talkbox-db --region lax
#   2. fly postgres attach talkbox-db          # sets DATABASE_URL secret automatically
#   3. fly secrets set \
#        DB_URI="<postgres connection string from step 2, postgresql+psycopg://...>" \
#        OPENAI_API_KEY="sk-..." \
#        JWT_SECRET="$(openssl rand -hex 32)" \
#        ADMIN_EMAIL="admin@example.com" \
#        ADMIN_PASSWORD="changeme" \
#        TWILIO_ACCOUNT_SID="..." \
#        TWILIO_AUTH_TOKEN="..." \
#        TWILIO_TWIML_APP_SID="..." \
#        TWILIO_API_KEY_SID="..." \
#        TWILIO_API_KEY_SECRET="..." \
#        TWILIO_PUBLIC_URL="https://talkbox.fly.dev" \
#        FRONTEND_URL="https://your-app.vercel.app"
#   4. fly deploy

app = 'talkbox'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'
  target = 'api'

[env]
  LOG_FILE = '/data/app.log'
  LOG_LEVEL = 'info'
  COOKIE_SECURE = '1'
  KIOSK_STT_PROVIDER = 'openai'
  LLM_PROVIDER = 'openai'
  EMBEDDINGS_PROVIDER = 'openai'
  EMBEDDINGS_MODEL = 'text-embedding-3-small'
  COLLECTION_NAME = 'query_categories'
  DB_NAME = 'sacramento'
  DB_TABLE_NAME = 'sacramento'
  CORS_ORIGINS = '*'
  KIOSK_MOCK_QUERY = 'false'
  KIOSK_CALLING_ENABLED = 'true'
  KIOSK_IDLE_RESET_SECONDS = '60'
  FSC_RESOURCE_SYNC_ENABLED = 'true'
  FSC_RESOURCE_SYNC_INTERVAL_SECONDS = '60'
  FSC_RESOURCE_REQUEST_TIMEOUT_SECONDS = '10'
  FSC_RESOURCE_CACHE_MAX_AGE_SECONDS = '86400'
  FSC_RESOURCE_CACHE_PATH = '/data/resource-snapshot.sqlite3'
  # Tailscale: the machine joins the tailnet as ${TS_HOSTNAME} and exposes the
  # API over Funnel so Twilio can reach https://${TS_HOSTNAME}.<tailnet>.ts.net.
  # Requires the TS_AUTHKEY secret (set separately). No-op without it.
  TS_HOSTNAME = 'talkbox'
  TS_FUNNEL = '1'

[[mounts]]
  source = 'talkbox_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always running: Tailscale Funnel serves the Twilio webhook
  # directly from the node, and a stopped machine cannot be woken via the
  # *.ts.net Funnel URL (only the fly.dev URL auto-starts via fly-proxy).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
